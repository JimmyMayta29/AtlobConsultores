<body>
    <div class="scroll-progress" id="scrollProgress"></div>
    <div id="header-container"></div>

    <main>
        <section class="services-header" id="revista-inicio">
            <div class="container">
                <span class="section-label reveal from-bottom">BLOG & ACTUALIDAD</span>
                <h1 class="reveal from-bottom">Revista ATLOB</h1>
                <p class="reveal from-bottom">Análisis fiscal, asientos contables y novedades normativas para estar siempre un paso adelante.</p>
                <div class="revista-header-actions reveal from-bottom" style="margin-top: 18px;">
                    <a href="/rss.xml" target="_blank" class="btn-pill" style="background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #ffffff; padding: 8px 18px; font-size: 0.88rem;">
                        <span><i class="fas fa-rss" style="color: #f2b705; margin-right: 6px;"></i> Suscribirse al Feed RSS</span>
                    </a>
                </div>
            </div>
        </section>

        <section class="magazine-container" id="revista-grid">
            <div class="container">
                <!-- Featured Article Slot -->
                <!-- FEATURED_HOOK_START -->
                <div id="featured-article-container"></div>
                <!-- FEATURED_HOOK_END -->

                <!-- Search and Categories Toolbar -->
                <div class="magazine-controls-wrapper">
                    <div class="magazine-search-container">
                        <div class="magazine-search-bar">
                            <i class="fas fa-search search-icon" aria-hidden="true"></i>
                            <input 
                                type="search" 
                                id="magazine-search-input" 
                                class="magazine-search-input" 
                                placeholder="Buscar artículos por título, tema o palabras clave (ej: SUNAT, IGV, PCGE)..." 
                                autocomplete="off"
                                aria-label="Buscar artículos en la revista"
                            >
                            <button type="button" id="magazine-search-clear" class="search-clear-btn" aria-label="Limpiar búsqueda" title="Limpiar búsqueda" style="display: none;">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div id="search-feedback" class="search-feedback" aria-live="polite"></div>
                    </div>

                    <nav class="magazine-nav reveal from-bottom" aria-label="Categorías del blog" id="magazine-categories-nav">
                        <a href="index.html" class="magazine-nav-pill active" data-category="all">Todos</a>
                        <a href="tributario.html" class="magazine-nav-pill" data-category="Tributario">Normativa Tributaria</a>
                        <a href="contabilidad.html" class="magazine-nav-pill" data-category="Contabilidad">Casos Prácticos</a>
                        <a href="auditoria.html" class="magazine-nav-pill" data-category="Auditoría">Auditoría y NIIF</a>
                        <a href="laboral.html" class="magazine-nav-pill" data-category="Laboral">Laboral y Planillas</a>
                    </nav>
                </div>

                <div class="magazine-grid" id="articles-grid">
                    <!-- POSTS_HOOK_START -->
                    <!-- Los artículos se cargarán dinámicamente aquí mediante JS -->
                    <!-- POSTS_HOOK_END -->
                </div>
            </div>
        </section>

    <div id="footer-container"></div>
