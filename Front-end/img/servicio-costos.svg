<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Vista demostrativa de costos operativos</title>
  <desc id="desc">Barras horizontales ilustrativas de cuatro categorías de costos. No representan importes ni distribución real de una empresa.</desc>
  <rect width="640" height="400" fill="#eef2f8"/>
  <rect x="18" y="18" width="604" height="364" rx="22" fill="#ffffff" stroke="#dce5ef"/>
  <g font-family="Outfit, Arial, sans-serif">
    <text x="44" y="68" fill="#0f3d66" font-size="27" font-weight="700">Costos operativos</text>
    <text x="44" y="98" fill="#5c6f89" font-size="17">Identifica cómo se distribuyen los recursos</text>
    <rect x="431" y="42" width="165" height="30" rx="15" fill="#fff4ce"/>
    <text x="513.5" y="62" text-anchor="middle" fill="#0f3d66" font-size="15" font-weight="600">Vista demostrativa</text>
    <g fill="#0f3d66" font-size="18" font-weight="500">
      <text x="44" y="161">Planillas</text><text x="44" y="215">Operaciones</text><text x="44" y="269">Tecnología</text><text x="44" y="323">Tributos</text>
    </g>
    <g fill="#eef2f8">
      <rect x="182" y="140" width="408" height="28" rx="8"/>
      <rect x="182" y="194" width="408" height="28" rx="8"/>
      <rect x="182" y="248" width="408" height="28" rx="8"/>
      <rect x="182" y="302" width="408" height="28" rx="8"/>
    </g>
    <rect x="182" y="140" width="367" height="28" rx="8" fill="#0f3d66"/>
    <rect x="182" y="194" width="279" height="28" rx="8" fill="#f2b705"/>
    <rect x="182" y="248" width="215" height="28" rx="8" fill="#0f3d66" opacity="0.78"/>
    <rect x="182" y="302" width="152" height="28" rx="8" fill="#0f3d66" opacity="0.55"/>
    <text x="320" y="362" text-anchor="middle" fill="#5c6f89" font-size="16">Distribución ilustrativa · sin importes reales</text>
  </g>
</svg>
