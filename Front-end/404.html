<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página no encontrada (Error 404) — Consultoría ATLOB. La ruta que buscas no existe o ha sido movida. Encuentra nuestros servicios contables o artículos aquí.">
    <meta name="robots" content="noindex, follow">
    <title>404 — Página no encontrada | Consultoría ATLOB</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/png" href="/favicon.png">

    <!-- Fonts & CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">

    <script defer src="/js/cookie-consent.js"></script>
    <script defer src="/js/analytics.js"></script>
    <script defer src="/js/layout-loader.js"></script>
    <script defer src="/js/main.js"></script>
</head>
<body class="page-404">
    <div class="scroll-progress" id="scrollProgress"></div>
    <div id="header-container"></div>

    <main class="error-404-main">
        <div class="container">
            <div class="error-404-card">
                <div class="error-badge-glow">
                    <span class="error-code">404</span>
                </div>
                
                <div class="error-icon-balance">
                    <i class="fas fa-balance-scale-right" aria-hidden="true"></i>
                </div>

                <h1>Página no encontrada</h1>
                <p class="error-desc">
                    El enlace que seguiste no existe, fue renombrado o se encuentra temporalmente fuera de servicio.
                </p>

                <!-- Search form on 404 page to help user -->
                <div class="error-search-box">
                    <form action="/revista/index.html" method="GET" class="search-form-404">
                        <input type="text" name="q" placeholder="¿Buscas algún artículo o tema tributario? (ej. SUNAT, IGV)" aria-label="Buscar en la revista">
                        <button type="submit" aria-label="Buscar">
                            <i class="fas fa-search"></i>
                        </button>
                    </form>
                </div>

                <div class="error-actions">
                    <a href="/index.html" class="btn-pill btn-pill--primary">
                        <span><i class="fas fa-home"></i> Volver al Inicio</span>
                    </a>
                    <a href="/servicios.html" class="btn-pill btn-pill--outline">
                        <span>Ver Servicios Contables</span>
                        <span class="btn-pill-arrow"><i class="fas fa-arrow-right"></i></span>
                    </a>
                    <a href="/revista/index.html" class="btn-pill btn-pill--outline">
                        <span>Revista ATLOB</span>
                        <span class="btn-pill-arrow"><i class="fas fa-book-open"></i></span>
                    </a>
                </div>

                <div class="error-help-contact">
                    <p>¿Necesitas comunicarte urgentemente con nuestros asesores?</p>
                    <a href="https://wa.me/51940781298" target="_blank" rel="noopener noreferrer" class="whatsapp-direct-link">
                        <i class="fab fa-whatsapp"></i> Escríbenos al WhatsApp: +51 940 781 298
                    </a>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
</body>
</html>
